<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>iPhone 17 Simulator</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      height: 100dvh; overflow: hidden; background: #000;
    }
    #frame {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; display: block; background: #000;
    }
  </style>
</head>
<body>
  <!-- Always load the fully-deployed simulator so CSS/JS never go missing -->
  <iframe
    id="frame"
    title="iPhone 17"
    src="https://i-phone17-mock.vercel.app/?embed=1"
    allow="camera; microphone; fullscreen; autoplay"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
  ></iframe>
</body>
</html>
